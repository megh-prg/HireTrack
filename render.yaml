# Render Blueprint: deploys the HireTrack backend + a Postgres database.
# In Render: New + -> Blueprint -> connect this repo. After it deploys, set the
# two secret env vars (GEMINI_API_KEY, CORS_ORIGINS) in the service's dashboard.
databases:
  - name: hiretrack-db
    plan: free
    databaseName: hiretrack
    user: hiretrack

services:
  - type: web
    name: hiretrack-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DATABASE_URL
        fromDatabase:
          name: hiretrack-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: SEED_DEMO_DATA
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      # One-time reset done; keep off so restarts preserve user data.
      - key: RESET_DB
        value: "false"
      # Set these two in the Render dashboard after deploy (kept out of git):
      #   GEMINI_API_KEY  -> your Gemini key
      #   CORS_ORIGINS    -> your Vercel frontend URL, e.g. https://career-copilot.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
