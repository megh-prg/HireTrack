services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiretrack
      POSTGRES_PASSWORD: hiretrack
      POSTGRES_DB: hiretrack
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiretrack -d hiretrack"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://hiretrack:hiretrack@db:5432/hiretrack
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      AUTO_REFRESH_HOURS: ${AUTO_REFRESH_HOURS:-12}
      # Optional: free key from https://developer.adzuna.com enables Adzuna India search.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
